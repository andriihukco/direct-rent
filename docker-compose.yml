services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dr}
      POSTGRES_DB: dr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr -d dr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
