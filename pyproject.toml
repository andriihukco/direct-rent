[project]
name = "directrent"
version = "0.1.0"
description = "Telegram bot that delivers owner-only rental listings in Lviv"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "telethon>=1.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["directrent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
